# One pod per participant seat: seat-1 ... seat-N, all in the default namespace.
# Each pod serves Qwen3-8B on its own chip and has this repo cloned at /workspace, so
# `kubectl exec -it seat-N -- bash` lands exactly where `docker exec -it vllm bash` used to.
#
# 105 seats: 100 participants plus 5 spares. Changing the count? Update k8s/workshop-rbac.yaml too.
---
apiVersion: v1
kind: Service
metadata:
  name: seat
  namespace: default
spec:
  clusterIP: None
  selector:
    app: seat
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seat
  namespace: default
spec:
  serviceName: seat
  replicas: 105
  # Seat numbers start at 1, so the pod name matches the number on the participant's card.
  ordinals:
    start: 1
  # Without this, 100 pods start one at a time, each waiting ~5 minutes for the model.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: seat
  template:
    metadata:
      labels:
        app: seat
    spec:
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc2
      initContainers:
        - name: clone
          image: alpine/git:latest
          command: ["git", "clone", "--depth", "1", "https://github.com/yahavb/trainium-agent-labs.git", "/workspace"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: app
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.24.0.1.1.0-neuronx-py313-sdk2.32.0-ubuntu24.04
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 160
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 10
              memory: 100Gi
            limits:
              cpu: 10
              memory: 100Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: workspace
              mountPath: /workspace
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          workingDir: /workspace
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_SKIP_EFA_AFFINITY
              value: "1"
            # Pre-set so the project commands work the moment a participant execs in.
            - name: HEATROD_BASE_URL
              value: http://localhost:8000/v1
            - name: KERNEL_AGENT_BASE_URL
              value: http://localhost:8000/v1
            - name: KERNEL_AGENT_MODEL
              value: Qwen/Qwen3-8B
          # Same settings as `MAX_MODEL_LEN=8192 ./serve.sh`. Blocks = ceil(8192 / 32) * 4.
          command:
            - /bin/bash
            - -exc
            - |
              vllm serve \
                --model "Qwen/Qwen3-8B" \
                --tensor-parallel-size 2 \
                --max-model-len 8192 \
                --max-num-seqs 4 \
                --block-size 32 \
                --num-gpu-blocks-override 1024 \
                --no-enable-prefix-caching \
                --port 8000
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        # Survives container restarts, not pod deletion. Participants' work lives here.
        - name: workspace
          emptyDir: {}
        # Shared per node, so 16 pods on one trn2.48xlarge download the 16 GB of weights once.
        - name: hf-cache
          hostPath:
            path: /opt/workshop/hf-cache
            type: DirectoryOrCreate
