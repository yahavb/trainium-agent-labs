# Alternative seats for a small turnout: mseat-1 ... mseat-N, two chips each (m-lnc2), serving
# gpt-oss-20b instead of Qwen3-8B. Same flow as k8s/workshop-seats.yaml: ./serve.sh in one
# `kubectl exec -it mseat-N -- bash`, the projects in a second one.
#
# 1 seat for now, to test the gpt-oss path. Changing the count? Update k8s/workshop-rbac.yaml too.
---
apiVersion: v1
kind: Service
metadata:
  name: mseat
  namespace: default
spec:
  clusterIP: None
  selector:
    app: mseat
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mseat
  namespace: default
spec:
  serviceName: mseat
  replicas: 1
  # Seat numbers start at 1, so the pod name matches the number on the participant's card.
  ordinals:
    start: 1
  # Without this, pods start one at a time.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mseat
  template:
    metadata:
      labels:
        app: mseat
    spec:
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: m-lnc2
      initContainers:
        - name: clone
          image: alpine/git:latest
          command: ["git", "clone", "--depth", "1", "https://github.com/yahavb/trainium-agent-labs.git", "/workspace"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: app
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.24.0.1.1.0-neuronx-py313-sdk2.32.0-ubuntu24.04
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            claims:
              - name: neurons
            # About 1/8 of a trn2.48xlarge (192 vCPU, 2 TiB RAM, 2000 GiB root disk), rounded down
            # so 8 seats still fit after kubelet reservations, the DaemonSets, images and hf-cache.
            requests:
              cpu: 22
              memory: 240Gi
              ephemeral-storage: 200Gi
            limits:
              cpu: 22
              memory: 240Gi
              ephemeral-storage: 200Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: workspace
              mountPath: /workspace
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          workingDir: /workspace
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_SKIP_EFA_AFFINITY
              value: "1"
            # Pre-set so the project commands work the moment a participant execs in.
            - name: HEATROD_BASE_URL
              value: http://localhost:8000/v1
            - name: KERNEL_AGENT_BASE_URL
              value: http://localhost:8000/v1
            - name: HEATROD_MODEL
              value: gpt-oss-20b
            - name: KERNEL_AGENT_MODEL
              value: gpt-oss-20b
            # Read by ./serve.sh: gpt-oss-20b instead of Qwen3-8B. Two chips at LNC=2 are 8 logical
            # cores; TP 4 is the per-replica degree measured on KEEP-ray. Untested in this image.
            - name: MODEL
              value: openai/gpt-oss-20b
            - name: TP
              value: "4"
            - name: MAX_MODEL_LEN
              value: "8192"
            # Load in bf16, and serve under the name the agents and gptoss/ clients use.
            - name: VLLM_EXTRA_ARGS
              value: '--served-model-name gpt-oss-20b --hf-overrides {"quantization_config":{}}'
          # The pod only holds the chip. The participant starts the model with ./serve.sh from a
          # first `kubectl exec`, then runs the projects from a second one against localhost:8000.
          command: ["sleep", "infinity"]
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        # Survives container restarts, not pod deletion. Participants' work lives here.
        - name: workspace
          emptyDir: {}
        # Shared per node with the seat pods, so each model downloads once per node.
        - name: hf-cache
          hostPath:
            path: /opt/workshop/hf-cache
            type: DirectoryOrCreate
