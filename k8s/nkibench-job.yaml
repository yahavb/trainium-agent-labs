---
apiVersion: batch/v1
kind: Job
metadata:
  name: nkibench
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      containers:
        - name: bench
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.24.0.1.1.0-neuronx-py313-sdk2.32.0-ubuntu24.04
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 8
              memory: 32Gi
            limits:
              cpu: 8
              memory: 32Gi
          volumeMounts:
            - name: code
              mountPath: /app
          workingDir: /app
          command:
            - /bin/bash
            - -ec
            - |
              echo "=============== environment ==============="
              python -c "import nki; print('nki', getattr(nki, '__version__', 'unknown'))"
              python -c "import nki; print('simulate:', hasattr(nki,'simulate'), '| simulate_kernel:', hasattr(nki,'simulate_kernel'))"
              python -c "import nki; print('public names:', sorted(n for n in dir(nki) if not n.startswith('_')))"
              python -c "import nki.language as nl; print('pmax', nl.tile_size.pmax, '| gemm stationary fmax', nl.tile_size.gemm_stationary_fmax, '| gemm moving fmax', nl.tile_size.gemm_moving_fmax)"
              python -c "import nki.isa as nisa; print('dma_copy is patchable:', callable(getattr(nisa, 'dma_copy', None)))"

              echo
              echo "=============== harness selftest ==============="
              python nkibench.py --selftest

              echo
              echo "=============== the ladder ==============="
              python nkibench.py --list
              python nkibench.py --roofline 512 1024 2048
              python nkibench.py --roofline 4096 4096 4096

              echo
              echo "=============== reference kernels through the harness ==============="
              rc=0
              for level in 1 2 3 4; do
                echo "--------------- level $level ---------------"
                python nkibench.py --level "$level" --show
                echo
                python nkibench.py --level "$level" --check "reference_level${level}.py" || rc=$?
                echo
              done
              echo "last non-zero check exit: $rc"
      volumes:
        - name: code
          configMap:
            name: nkibench-code
