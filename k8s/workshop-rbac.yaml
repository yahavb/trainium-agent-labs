# What the shared EKSExec credentials may do in the cluster: list pods, and exec into or read the
# logs of seat-1 ... seat-150 only. Nothing else — no delete, no create, no other pods.
# EKSExec is mapped to the group workshop-participants by an EKS access entry (see workshop/FACILITATOR.md).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workshop-participant
  namespace: default
rules:
  # Listing cannot be restricted by name, so participants can see every pod in default.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
    resourceNames: [
