<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3-8B decode throughput on Trainium 2: baseline vs DFlash2</title>
  <desc id="desc">Single request, greedy, 128 new tokens, TP=2 on one trn2 chip. Baseline 51.9 tokens per second, DFlash2 with 4 draft tokens 68.9 tokens per second, a 1.33x speedup.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Qwen3-8B on Trainium 2 — decode throughput</text>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#444">1 request, greedy, 128 new tokens, TP=2 on one trn2 chip, same server config</text>
  <line x1="170" y1="80" x2="170" y2="250" stroke="#333"/>
  <!-- scale: 80 tok/s = 400 px -->
  <text x="160" y="125" text-anchor="end" font-size="14" fill="#111">Baseline</text>
  <rect x="170" y="100" width="259.5" height="40" fill="#6b7280"/>
  <text x="437" y="125" font-size="14" fill="#111">51.9 tok/s</text>
  <text x="160" y="195" text-anchor="end" font-size="14" fill="#111">+ DFlash2 (4 drafts)</text>
  <rect x="170" y="170" width="344.5" height="40" fill="#2563eb"/>
  <text x="522" y="195" font-size="14" font-weight="bold" fill="#111">68.9 tok/s (1.33x)</text>
  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#444">Draft acceptance 20.1% (344 of 1708 draft tokens) — 1.81 tokens per target step</text>
</svg>
